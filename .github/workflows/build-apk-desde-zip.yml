name: Compilar APK Sistema Artesanal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sistema_Artesanal_v6_0_PARA_GITHUB.zip'
      - '.github/workflows/build-apk-desde-zip.yml'

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto Android del ZIP
        shell: bash
        run: |
          unzip -oq Sistema_Artesanal_v6_0_PARA_GITHUB.zip -d .
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/assets/artesanal.sqlite
          test -f app/src/main/AndroidManifest.xml

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Usar Android SDK preinstalado e instalar Android 35
        shell: bash
        run: |
          echo "SDK: $ANDROID_HOME"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKM" && test -x "$SDKM"
          echo "SDK manager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK de prueba
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Artesanal-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
