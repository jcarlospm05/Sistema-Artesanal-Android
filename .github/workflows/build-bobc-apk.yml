name: Compilar BOBC 0.7.1 Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android-bobc-07/**'
      - '.github/workflows/build-bobc-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar e instalar firma de pruebas
        run: gradle --no-daemon -p android-bobc-07 :app:assembleDebug --stacktrace
      - name: Verificar APK
        run: |
          set -e
          mkdir -p apk
          cp android-bobc-07/app/build/outputs/apk/debug/app-debug.apk apk/BOBC_0.7.1_Android_debug.apk
          test -s apk/BOBC_0.7.1_Android_debug.apk
          sha256sum apk/BOBC_0.7.1_Android_debug.apk
          unzip -t apk/BOBC_0.7.1_Android_debug.apk | tail -2
      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: BOBC-0.7.1-Android-APK
          path: apk/BOBC_0.7.1_Android_debug.apk
          if-no-files-found: error
          retention-days: 90